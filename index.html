<style>/* =====================================================================
   INFRABR DESIGN SYSTEM — COLOR TOKENS
   Source of truth:
   - Game code: CidadesInteligentesGame02.py (InfraBR palette, pg.9 cartilha)
   - CONFEA Manual de Identidade Visual 2023 (institutional brasão colors)
   The game's dark-navy UI is being REFORMULATED into a lighter, modern,
   "game of good taste" direction per brand brief — so alongside the raw
   source hues below, this file adds the light-surface semantic layer
   that the redesigned UI kit actually uses.
   ===================================================================== */

:root {
  /* ---------- InfraBR brand hues (from game source, cartilha pg.9) ---------- */
  --infra-blue:    #002878;
  --infra-green:   #008c00;
  --infra-yellow:  #ffb900;

  /* ---------- CONFEA institutional colors (Manual de Marca 2023, pg.5) ---------- */
  --confea-blue:   #00509b;  /* Pantone 280C */
  --confea-gold:   #ba9705;  /* Pantone 457C */
  --confea-black:  #231f20;

  /* ---------- Data / score scale (map + dimension coding, preserved verbatim) ---------- */
  --score-green:        #2E9D3F;
  --score-green-light:  #B5D043;
  --score-yellow:       #FAD040;
  --score-orange:       #EE7C2A;
  --score-red:          #C8252C;
  --score-blue:         #4A8FE8;

  /* ---------- Neutral ramp (new light-mode redesign — derived from infra-blue) ---------- */
  --navy-950: #081942;
  --navy-900: #0C1F4D;
  --navy-800: #142C5E;
  --navy-700: #1C3669;
  --navy-600: #25427A;
  --navy-100: oklch(from var(--infra-blue) 0.95 0.02 h);
  --navy-50:  oklch(from var(--infra-blue) 0.98 0.01 h);

  /* ---------- Semantic surfaces — LIGHT MODE (default, redesigned direction) ---------- */
  --surface-page:     #F6F8FC;
  --surface-card:     #FFFFFF;
  --surface-card-2:   #FBFCFE;
  --surface-sunken:   #EEF2FA;
  --surface-inverse:  var(--navy-900);

  --border-subtle:   rgba(11, 27, 74, 0.08);
  --border-default:  rgba(11, 27, 74, 0.14);
  --border-strong:   rgba(11, 27, 74, 0.24);
  --border-accent:   rgba(255, 185, 0, 0.55);

  --text-ink:      #0B1B3A;
  --text-body:      rgba(11, 27, 58, 0.78);
  --text-muted:     rgba(11, 27, 58, 0.55);
  --text-faint:     rgba(11, 27, 58, 0.34);
  --text-on-dark:   #F8F2E1;
  --text-on-accent: var(--infra-blue);

  /* ---------- Semantic surfaces — DARK MODE (legacy game screen, kept as alt theme) ---------- */
  --dark-bg:        var(--navy-900);
  --dark-bg-deep:   var(--navy-950);
  --dark-card:      var(--navy-800);
  --dark-card-2:    var(--navy-700);
  --dark-card-3:    var(--navy-600);
  --dark-border:    rgba(255, 185, 0, 0.10);
  --dark-border-2:  rgba(255, 185, 0, 0.22);
  --dark-text:      #F8F2E1;
  --dark-text-2:    rgba(248, 242, 225, 0.75);
  --dark-text-3:    rgba(248, 242, 225, 0.55);

  /* ---------- Accent ---------- */
  --accent:         var(--infra-yellow);
  --accent-hover:   #E8AC06;
  --accent-ink:     var(--infra-blue);

  /* ---------- Dimension coding (InfraBR's 6 eixos, verbatim from source) ---------- */
  --dim-energia:        #FAD040;
  --dim-mobilidade:     #2E9D3F;
  --dim-agua:           #2563EB;
  --dim-saneamento:     #B5D043;
  --dim-bem-estar:      #EE7C2A;
  --dim-meio-ambiente:  #2E9D3F;

  /* ---------- Feedback ---------- */
  --success:  #2E9D3F;
  --success-bg: rgba(46, 157, 63, 0.10);
  --danger:   #C8252C;
  --danger-bg: rgba(200, 37, 44, 0.10);
  --warning:  #EE7C2A;
  --warning-bg: rgba(238, 124, 42, 0.10);

  /* ---------- Glow / special-effect gradients (the "game feel" layer) ---------- */
  --glow-yellow: radial-gradient(600px 420px at 100% 0%, rgba(255,185,0,0.16), transparent 60%); /* @kind other */
  --glow-green:  radial-gradient(560px 400px at 0% 100%, rgba(0,140,0,0.10), transparent 60%); /* @kind other */
  --glow-blue:   radial-gradient(520px 460px at 50% 0%, rgba(0,40,120,0.08), transparent 65%); /* @kind other */
}

/* =====================================================================
   INFRABR DESIGN SYSTEM — TYPE TOKENS
   Fonts verbatim from game source: 'Bricolage Grotesque' (display) +
   'Inter' (body/UI). Both are Google Fonts — loaded via @import so the
   design-system compiler's font closure resolves real 

/* =====================================================================
   INFRABR DESIGN SYSTEM — SPACING, RADIUS, SHADOW, MOTION TOKENS
   ===================================================================== */

:root {
  /* Spacing scale (as used across the game's CSS — 4/6/8/12/14/16/18/20/22/24/28/32/36) */
  --space-1: 4px;
  --space-2: 6px;
  --space-3: 8px;
  --space-4: 12px;
  --space-5: 16px;
  --space-6: 20px;
  --space-7: 24px;
  --space-8: 28px;
  --space-9: 36px;
  --space-10: 48px;
  --space-11: 64px;

  /* Radius — pill buttons/chips, rounded cards (verbatim from source) */
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 14px;
  --radius-xl: 20px;
  --radius-2xl: 28px;
  --radius-pill: 999px;

  /* Shadow — light-mode cards read as soft-lifted, not flat/bordered-only */
  --shadow-card: 0 1px 0 rgba(11,27,74,0.04), 0 14px 40px -18px rgba(11,27,74,0.22);
  --shadow-card-hover: 0 1px 0 rgba(11,27,74,0.05), 0 20px 50px -16px rgba(11,27,74,0.28);
  --shadow-modal: 0 24px 60px rgba(8,25,66,0.28);
  --shadow-glow-accent: 0 0 0 3px rgba(255,185,0,0.16), 0 8px 24px -8px rgba(255,185,0,0.35);

  /* Blur (glass surfaces — modal scrims, sticky bars) */
  --blur-modal: blur(14px) saturate(140%); /* @kind other */
  --blur-header: saturate(180%) blur(10px); /* @kind other */

  /* Motion — easing + duration used throughout the game */
  --ease-out-game: cubic-bezier(.2,.7,.3,1); /* @kind other */
  --ease-pop: cubic-bezier(.2,1,.3,1); /* @kind other */
  --duration-fast: .15s; /* @kind other */
  --duration-base: .25s; /* @kind other */
  --duration-screen: .35s; /* @kind other */
}

/* =====================================================================
   INFRABR DESIGN SYSTEM — TECH/FX TOKENS
   The "innovative, technological, eye-catching" effects layer: animated
   gradient-ring frames, HUD scanlines, drifting mesh backdrop, glow
   pulses. Kept in its own file so the calmer foundation tokens stay
   readable; these are strictly additive (opt-in per-component).
   ===================================================================== */

:root {
  --tech-ring-gradient: conic-gradient(from 0deg, var(--infra-yellow), var(--score-green), var(--score-blue), var(--infra-yellow));
  --tech-grid-line: rgba(11, 27, 74, 0.06);
  --tech-scan-band: linear-gradient(100deg, transparent 30%, rgba(255,255,255,0.55) 48%, rgba(255,185,0,0.28) 52%, transparent 68%); /* @kind other */
  --tech-glow-critical: 0 0 22px rgba(200,37,44,0.55);
  --tech-glow-warn: 0 0 18px rgba(238,124,42,0.45);
  --tech-glow-ok: 0 0 16px rgba(46,157,63,0.35);
}

@keyframes techSpin { to { transform: rotate(360deg); } }

@keyframes techScan { 0% { transform: translateX(-120%); } 100% { transform: translateX(120%); } }

@keyframes meshDrift {
  0%   { transform: translate(0, 0) scale(1); }
  50%  { transform: translate(-3%, 2%) scale(1.06); }
  100% { transform: translate(0, 0) scale(1); }
}

@keyframes glowPulse {
  0%, 100% { filter: drop-shadow(0 0 6px rgba(255,185,0,0.35)); }
  50%      { filter: drop-shadow(0 0 16px rgba(255,185,0,0.65)); }
}

@keyframes ctaGlow {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255,185,0,0.45), var(--shadow-card); }
  50%      { box-shadow: 0 0 0 8px rgba(255,185,0,0), var(--shadow-card); }
}

@keyframes countTick { from { opacity: .4; transform: translateY(2px); } to { opacity: 1; transform: none; } }

@keyframes gridFlow { from { background-position: 0 0; } to { background-position: 0 46px; } }

@keyframes beamSweep { 0%, 100% { top: -2%; opacity: 0; } 8% { opacity: 1; } 48% { top: 102%; opacity: 1; } 56%, 99% { top: 102%; opacity: 0; } }

@keyframes dataFall { from { transform: translateY(-120px); } to { transform: translateY(110vh); } }

@keyframes cornerPulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }

/* Rotating gradient-ring frame — deprecated (see ui_kits/desafio-infrabr/TechBackdrop.jsx) */
.tech-frame { position: relative; border-radius: inherit; }
.tech-frame-inner { position: relative; border-radius: inherit; background: var(--surface-card); }

/* Dot-grid HUD texture */
.tech-grid-bg {
  background-image: radial-gradient(var(--tech-grid-line) 1px, transparent 1px);
  background-size: 26px 26px;
}

</style>
<style>/* Desafio InfraBR v2 — "Órbita". Uma tela, sem scroll, em qualquer device.
   Cor dominante por tela vem de --ax (setada inline no .ib-app). */
:root{--ax:#ffb900;--ax-ink:#002878}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:var(--font-body);background:var(--surface-page);color:var(--text-ink);-webkit-font-smoothing:antialiased}
a{color:var(--infra-blue);text-decoration:none}a:hover{color:var(--accent-hover)}
button{font-family:inherit}

.ib-app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;isolation:isolate}
.ib-atmos,.ib-veil,.ib-grid{position:absolute;inset:0;pointer-events:none}
.ib-atmos{z-index:0}
.ib-veil{z-index:0;background:radial-gradient(78vw 62vh at 88% -14%,color-mix(in oklab,var(--ax) 20%,transparent),transparent 68%),radial-gradient(62vw 52vh at -12% 104%,color-mix(in oklab,var(--ax) 11%,transparent),transparent 70%);transition:background .55s ease}
.ib-grid{z-index:0;background-image:linear-gradient(to right,rgba(11,27,58,.05) 1px,transparent 1px),linear-gradient(to bottom,rgba(11,27,58,.05) 1px,transparent 1px);background-size:clamp(38px,5vw,68px) clamp(38px,5vw,68px);-webkit-mask-image:radial-gradient(110% 85% at 50% 24%,#000,transparent);mask-image:radial-gradient(110% 85% at 50% 24%,#000,transparent)}

/* ---------- HUD ---------- */
.ib-hud{position:relative;z-index:20;flex:0 0 auto;display:flex;align-items:center;gap:clamp(8px,1.5vw,18px);padding:clamp(7px,1vh,12px) clamp(12px,3vw,38px);border-bottom:1px solid var(--border-subtle);background:color-mix(in srgb,var(--surface-page) 76%,transparent);backdrop-filter:blur(14px) saturate(150%)}
.ib-hud img.mark{height:clamp(20px,2.4vh,30px);width:auto;display:block}
.ib-hud .sep{width:1px;height:22px;background:var(--border-subtle);flex:0 0 auto}
.ib-spacer{flex:1}
.ib-mono{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-muted)}
.ib-mono.ax{color:color-mix(in srgb,var(--ax-ink) 72%,var(--ax))}
.ib-stat{display:flex;flex-direction:column;align-items:flex-end;gap:2px;line-height:1}
.ib-stat b{font:700 clamp(14px,1.7vh,19px)/1 var(--font-display);font-variant-numeric:tabular-nums}
.ib-ghost{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid var(--border-default);background:transparent;color:var(--text-body);font-size:12px;cursor:pointer;transition:background .16s,border-color .16s,transform .16s}
.ib-ghost:hover{background:color-mix(in srgb,var(--ax) 10%,transparent);border-color:var(--ax);transform:translateY(-1px)}
.ib-steps{display:flex;align-items:center;gap:4px}
.ib-step{width:16px;height:3px;border-radius:2px;background:var(--border-default);transition:background .4s ease,width .4s ease}
.ib-step.on{background:var(--ax);width:30px}
@media(max-width:760px),(max-height:620px){.ib-hud .hide-sm{display:none}}

/* ---------- Palco: ocupa o que sobrou, nunca rola ---------- */
.ib-stage{position:relative;z-index:1;flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:clamp(8px,1.6vh,26px) clamp(12px,2.6vw,36px)}
.ib-fit{width:100%;max-width:1340px;transform-origin:center center;will-change:transform}
.ib-split{display:grid;gap:clamp(12px,2.2vh,40px) clamp(16px,2.4vw,44px);grid-template-columns:1fr;align-items:center}
@media(min-width:860px){.ib-split{grid-template-columns:minmax(0,1fr) minmax(0,1.02fr)}.ib-split.wide-left{grid-template-columns:minmax(0,1.12fr) minmax(0,.88fr)}}
.ib-stack{display:flex;flex-direction:column;gap:clamp(9px,1.4vh,20px);min-width:0}
.ib-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}

.ib-h1{font:700 clamp(26px,3.6vw + .6vh,54px)/1.04 var(--font-display);font-optical-sizing:auto;letter-spacing:-.022em;margin:0;text-wrap:balance}
.ib-h1 em{font-style:normal;font-weight:800;font-size:.92em;letter-spacing:-.005em;color:var(--infra-blue);background:linear-gradient(transparent 58%,color-mix(in srgb,var(--accent) 62%,transparent) 58%);padding:0 .05em}
.ib-h2{font:700 clamp(19px,2.4vw,31px)/1.12 var(--font-display);font-optical-sizing:auto;letter-spacing:-.018em;margin:0;text-wrap:balance}
.ib-h3{font:700 clamp(15px,1.5vw,18px)/1.25 var(--font-display);letter-spacing:-.008em;margin:0}
.ib-lead{font-size:clamp(12.5px,1vw,15.5px);line-height:1.58;color:var(--text-body);max-width:54ch;margin:0;text-wrap:pretty}
.ib-kicker{display:inline-flex;align-items:center;gap:8px}
.ib-kicker i{width:20px;height:2px;background:var(--ax);display:block}
.ib-card{background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:clamp(14px,1.4vw,22px);box-shadow:var(--shadow-card)}
.ib-pad{padding:clamp(13px,1.8vh,26px) clamp(14px,1.6vw,26px)}
.ib-rule{height:1px;background:var(--border-subtle)}
@media(max-height:700px){.opt-hide{display:none}}
@media(max-width:859px){.narrow-hide{display:none}}

/* ---------- Abertura ---------- */
.ib-boot{position:fixed;inset:0;z-index:60;background:var(--surface-page);display:grid;place-items:center;overflow:hidden}
.ib-boot-in{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;padding:24px}
.ib-boot-in img{width:clamp(170px,26vw,320px);opacity:0;filter:blur(12px)}
.ib-boot-l{opacity:0;white-space:nowrap}
.ib-boot-bar{width:min(300px,68vw);height:2px;background:var(--border-subtle);overflow:hidden}
.ib-boot-bar i{display:block;height:100%;width:0;background:var(--ax)}

/* ---------- Mapa do Brasil ---------- */
.ib-map{position:relative;width:100%;height:clamp(190px,44vh,540px);touch-action:none}
.ib-map canvas{width:100%;height:100%;display:block}
.ib-map .hint{position:absolute;left:50%;bottom:0;transform:translateX(-50%);pointer-events:none}
@media(max-width:859px){.ib-map{height:clamp(190px,32vh,340px)}}
.ib-legend{display:flex;flex-wrap:wrap;gap:8px 14px}
.ib-legend span{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;color:var(--text-faint)}
.ib-legend i{width:9px;height:9px;border-radius:2px;display:block}
.ib-ufgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:5px}
.ib-uf{padding:7px 3px;border-radius:9px;border:1px solid var(--border-subtle);background:var(--surface-card);cursor:pointer;font:600 11.5px var(--font-mono);color:var(--text-body);display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .14s,border-color .14s,background .14s}
.ib-uf:hover{transform:translateY(-2px);border-color:var(--ax)}
.ib-uf.on{border-color:var(--ax);background:color-mix(in srgb,var(--ax) 14%,var(--surface-card))}
.ib-uf i{width:100%;height:3px;border-radius:2px;display:block}

/* ---------- Quiz ---------- */
.ib-qhead{display:flex;align-items:flex-start;gap:clamp(10px,1.8vw,20px)}
.ib-q{font:700 clamp(17px,1.5vw + .8vh,30px)/1.2 var(--font-display);font-optical-sizing:auto;letter-spacing:-.016em;margin:0;text-wrap:pretty}
.ib-opts{display:grid;gap:8px;grid-template-columns:1fr}
@media(min-width:780px){.ib-opts{grid-template-columns:1fr 1fr}}
.ib-opt{position:relative;display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:12px 15px;min-height:clamp(52px,7vh,64px);border-radius:14px;border:1px solid var(--border-default);background:var(--surface-card);cursor:pointer;font:500 clamp(12.5px,1vw,14.5px)/1.4 var(--font-body);color:var(--text-ink);transition:transform .16s ease,border-color .16s ease,background .16s ease,box-shadow .16s ease,opacity .25s ease;overflow:hidden}
.ib-opt:hover{transform:translateY(-1px);border-color:var(--ax);background:color-mix(in srgb,var(--ax) 8%,var(--surface-card))}
.ib-opt .k{flex:0 0 auto;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font:600 11.5px var(--font-mono);background:var(--surface-sunken);color:var(--text-muted);transition:background .16s,color .16s}
.ib-opt.sel{border-color:var(--ax);box-shadow:0 0 0 3px color-mix(in srgb,var(--ax) 24%,transparent)}
.ib-opt.sel .k{background:var(--ax);color:var(--ax-ink)}
.ib-opt.ok{border-color:var(--success);background:var(--success-bg)}
.ib-opt.ok .k{background:var(--success);color:#fff}
.ib-opt.bad{border-color:var(--danger);background:var(--danger-bg)}
.ib-opt.bad .k{background:var(--danger);color:#fff}
.ib-opt.dim{opacity:.3}
.ib-opt .sweep{position:absolute;inset:0;pointer-events:none;background:linear-gradient(100deg,transparent 20%,color-mix(in srgb,var(--success) 42%,transparent) 50%,transparent 80%);transform:translateX(-120%)}
.ib-skel{height:clamp(52px,7vh,64px);border-radius:14px;border:1px dashed var(--border-default);background:linear-gradient(100deg,var(--surface-sunken) 30%,color-mix(in srgb,var(--ax) 14%,var(--surface-sunken)) 50%,var(--surface-sunken) 70%);background-size:220% 100%;animation:ibShim 2.2s linear infinite;display:grid;place-items:center}
@keyframes ibShim{from{background-position:120% 0}to{background-position:-120% 0}}
.ib-readbar{height:4px;border-radius:3px;background:var(--surface-sunken);overflow:hidden}
.ib-readbar i{display:block;height:100%;background:var(--ax);transition:width .2s linear}
.ib-feedback{border-radius:14px;padding:clamp(12px,1.5vh,18px);border:1px solid var(--border-subtle);background:var(--surface-card-2)}

/* ---------- Resultado ---------- */
.ib-big{font:800 clamp(48px,5vw + 4vh,132px)/.9 var(--font-display);font-optical-sizing:auto;letter-spacing:-.04em;font-variant-numeric:tabular-nums;margin:0}
.ib-metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:1px;background:var(--border-subtle);border-radius:13px;overflow:hidden}
.ib-metrics>div{background:var(--surface-card);padding:11px 14px;display:flex;flex-direction:column;gap:5px}
.ib-metrics b{font:700 clamp(17px,1.9vw,25px)/1 var(--font-display);font-variant-numeric:tabular-nums}
.ib-badge3d{perspective:1000px}
.ib-badge3d>div{transform-style:preserve-3d}

/* ---------- Formulários / eixos ---------- */
.ib-field{display:flex;flex-direction:column;gap:6px;min-width:0}
.ib-field input,.ib-field textarea{width:100%;background:var(--surface-card-2);border:1px solid var(--border-default);border-radius:11px;padding:clamp(9px,1.3vh,13px) 14px;font:400 clamp(13px,1vw,15px) var(--font-body);color:var(--text-ink);outline:none;transition:border-color .16s,box-shadow .16s}
.ib-field textarea{min-height:clamp(70px,13vh,120px);resize:none;line-height:1.5}
.ib-field input:focus,.ib-field textarea:focus{border-color:var(--ax);box-shadow:0 0 0 3px color-mix(in srgb,var(--ax) 20%,transparent)}
.ib-eixos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:7px}
.ib-eixo{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:11px;border:1px solid var(--border-subtle);background:var(--surface-card);cursor:pointer;font-size:12px;color:var(--text-body);text-align:left;transition:transform .14s,border-color .14s,background .14s}
.ib-eixo:hover{transform:translateY(-1px);border-color:var(--ax)}
.ib-eixo.on{border-color:var(--ax);background:color-mix(in srgb,var(--ax) 12%,var(--surface-card));color:var(--text-ink);font-weight:600}
.ib-ico{width:clamp(18px,2.2vh,24px);height:clamp(18px,2.2vh,24px);object-fit:contain;flex:0 0 auto;display:block}
.ib-eixorow{display:flex;flex-wrap:wrap;gap:10px 16px}
.ib-eixorow span{display:inline-flex;align-items:center;gap:6px}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.001s!important}}
.ib-me{position:relative;border-radius:12px;animation:ibMe 1.25s ease-in-out infinite}
@keyframes ibMe{0%,100%{box-shadow:0 0 0 2px var(--accent),0 0 0 7px color-mix(in srgb,var(--accent) 30%,transparent)}50%{box-shadow:0 0 0 2px var(--accent),0 0 0 14px color-mix(in srgb,var(--accent) 0%,transparent)}}
.ib-ranklist{display:flex;flex-direction:column;gap:4px;max-height:min(58vh,440px);overflow:auto}
.ib-sent{display:flex;align-items:center;gap:9px;padding:11px 14px;border-radius:12px;background:var(--success-bg);border:1px solid color-mix(in srgb,var(--success) 40%,transparent);color:var(--text-ink);font-size:13px}
</style>
<style>
/* ===== Ajustes de produção (área segura, iOS e rede de segurança do Fit) ===== */
.ib-app{padding-bottom:env(safe-area-inset-bottom)}
.ib-hud{padding-top:calc(clamp(7px,1vh,12px) + env(safe-area-inset-top))}
.ib-stage.ib-scroll{overflow-y:auto;align-items:flex-start;-webkit-overflow-scrolling:touch}
.ib-field input,.ib-field textarea{-webkit-appearance:none;appearance:none}
.ib-uf{position:relative}
.ib-uf.played::after{content:'';position:absolute;top:4px;right:5px;width:5px;height:5px;border-radius:50%;background:var(--infra-blue);opacity:.45}
.ib-opt:disabled{cursor:default}
img.ib-ico{user-select:none;-webkit-user-drag:none}
@media (max-width:760px),(max-height:620px){.hide-sm{display:none!important}}
</style>
